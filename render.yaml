services:
  - type: web
    name: mymessenger
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: ADMIN_PHONE
        value: "+000"
      - key: LOGIN_CODE
        value: "1234"
